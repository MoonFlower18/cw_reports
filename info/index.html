<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Информация</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        .container {
            max-width: 1000px;
            width: 100%;
            background: white;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            padding: 30px;
            border-radius: 12px;
        }

        h1 {
            font-size: 36px;
            margin-bottom: 30px;
            color: #333;
            text-align: center;
        }

        /* Каждый пункт инструкции — строка */
        .instruction-item {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
            border-bottom: 1px solid #eee;
            padding-bottom: 20px;
        }

        /* Картинка с номером (самая левая) */
        .number-icon {
            flex-shrink: 0;
            width: 60px;
            text-align: center;
        }

        .number-icon img {
            max-width: 100%;
            height: auto;
            display: block;
        }

        /* Картинка-заглушка (посередине) */
        .step-image {
            flex-shrink: 0;
            width: 100px;
            text-align: center;
        }

        .step-image img {
            max-width: 100%;
            height: auto;
            display: block;
            border-radius: 8px;
            border: 1px solid #ddd;
        }

        /* Текст инструкции (справа) */
        .step-text {
            flex: 1;
            font-size: 18px;
            line-height: 1.5;
            color: #333;
        }

        .back-button {
            text-align: center;
            margin-top: 40px;
        }

        .button {
            display: inline-block;
            font-size: 18px;
            padding: 10px 20px;
            background-color: #f0f0f0;
            border: 1px solid #ccc;
            border-radius: 4px;
            text-decoration: none;
            color: black;
        }

        .button:hover {
            background-color: #e0e0e0;
        }

        /* Для мобильных — всё вертикально */
        @media (max-width: 700px) {
            .instruction-item {
                flex-direction: column;
                text-align: center;
                gap: 12px;
            }
            .number-icon, .step-image {
                width: 50px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Информация</h1>

    <!-- Шаг 1 -->
    <div class="instruction-item">
        <div class="number-icon">
            <img src="https://placehold.co/60x60/FF6B6B/white?text=1" alt="Номер 1">
        </div>
        <div class="step-image">
            <img src="https://placehold.co/100x100/CCCCCC/969696?text=Шаг+1" alt="Картинка шага 1">
        </div>
        <div class="step-text">
            Первый шаг: 
        </div>
    </div>

    <!-- Шаг 2 -->
    <div class="instruction-item">
        <div class="number-icon">
            <img src="https://placehold.co/60x60/4ECDC4/white?text=2" alt="Номер 2">
        </div>
        <div class="step-image">
            <img src="https://placehold.co/100x100/CCCCCC/969696?text=Шаг+2" alt="Картинка шага 2">
        </div>
        <div class="step-text">
            Второй шаг: 
        </div>
    </div>

    <!-- Шаг 3 -->
    <div class="instruction-item">
        <div class="number-icon">
            <img src="https://placehold.co/60x60/45B7D1/white?text=3" alt="Номер 3">
        </div>
        <div class="step-image">
            <img src="https://placehold.co/100x100/CCCCCC/969696?text=Шаг+3" alt="Картинка шага 3">
        </div>
        <div class="step-text">
            Третий шаг: 
        </div>
    </div>

    <!-- Шаг 4 -->
    <div class="instruction-item">
        <div class="number-icon">
            <img src="https://placehold.co/60x60/96CEB4/white?text=4" alt="Номер 4">
        </div>
        <div class="step-image">
            <img src="https://placehold.co/100x100/CCCCCC/969696?text=Шаг+4" alt="Картинка шага 4">
        </div>
        <div class="step-text">
            Четвёртый шаг: 
        </div>
    </div>
</div>

<div class="back-button">
    <a href="../" class="button">⬅ Вернуться на главную</a>
</div>

</body>
</html>
