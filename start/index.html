<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Start - Карточки</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        .container {
            max-width: 1200px;
            width: 100%;
            background: white;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            padding: 30px;
            border-radius: 12px;
        }

        h1 {
            font-size: 36px;
            margin-bottom: 40px;
            color: #333;
            text-align: center;
        }

        /* Сетка карточек: 4 колонки */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 25px;
        }

        /* Карточка */
        .card {
            background: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            cursor: pointer;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }

        .card-link {
            text-decoration: none;
            display: block;
        }

        /* Картинка внутри карточки */
        .card-image {
            width: 100%;
            aspect-ratio: 1 / 1; /* квадратная картинка */
            object-fit: cover;
            display: block;
            background-color: #f0f0f0;
        }

        /* Подпись под картинкой */
        .card-caption {
            padding: 15px;
            text-align: center;
            font-size: 16px;
            color: #555;
            border-top: 1px solid #eee;
            background-color: #fafafa;
        }

        /* Кнопка назад */
        .back-button {
            text-align: center;
            margin-top: 40px;
        }

        .button {
            display: inline-block;
            font-size: 18px;
            padding: 10px 20px;
            background-color: #f0f0f0;
            border: 1px solid #ccc;
            border-radius: 4px;
            text-decoration: none;
            color: black;
        }

        .button:hover {
            background-color: #e0e0e0;
        }

        /* Адаптация под планшеты и телефоны */
        @media (max-width: 900px) {
            .cards-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 20px;
            }
        }

        @media (max-width: 600px) {
            .cards-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 15px;
            }
            h1 {
                font-size: 28px;
            }
        }

        @media (max-width: 400px) {
            .cards-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
